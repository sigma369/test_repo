name: test_repo

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  built:
    runs-on: ubuntu-latest

    steps:
      - name: download the repo
        uses: actions/checkout@v4
        with:
          repository: sigma369/test_repo
          ref: master
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run the file
        run: python program.py
      

    


  
  
